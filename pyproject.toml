[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leyline-code"
version = "0.0.7"
description = "Map a codebase into a layered graph: deterministic facts, LLM inferences, and your intent."
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-c-sharp>=0.23",
  "tree-sitter-python>=0.23",
  "mcp>=1.0",
  "networkx>=3.0",
]

[project.optional-dependencies]
scip = ["protobuf>=7.35"]

[project.scripts]
leyline = "leyline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leyline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixture", "fixture2"]
python_files = ["test_index.py"]
