[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leyline-code"
version = "0.3.0"
description = "Map a codebase so a person can plan a change, have an agent write the code, and check that it was done as agreed."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-c-sharp>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-typescript>=0.23",
  "mcp>=1.0",
  "networkx>=3.0",
]

[project.optional-dependencies]
scip = ["protobuf>=7.35"]
# Grammars for the generic adapter. Any tree-sitter grammar package works; these are the common ones.
languages = ["tree-sitter-go", "tree-sitter-rust", "tree-sitter-java", "tree-sitter-kotlin", "tree-sitter-swift",
             "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-ruby", "tree-sitter-php", "tree-sitter-scala",
             "tree-sitter-lua", "tree-sitter-bash", "tree-sitter-gdscript"]

[project.urls]
Homepage = "https://github.com/Orbitope/leyline"
Issues = "https://github.com/Orbitope/leyline/issues"

[project.scripts]
leyline = "leyline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leyline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixture", "fixture2", "fixture3", "fixture4", "fixture5", "fixture_ws"]
python_files = ["test_index.py", "test_viewer.py", "test_channels.py"]
