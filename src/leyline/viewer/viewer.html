<title>Leyline map of __LEYLINE_REPO__</title>
<style>
/* Layout: a survey sheet. Map canvas left, inspector right; one header row of navigation above.
   No web fonts: the page fetches nothing, so it uses the faces already on the machine. */
:root {
  --bg: #ecf0ed; --surface: #f8faf8; --sunken: #e2e8e4; --ink: #15201c; --muted: #586860;
  --line: #c6d0ca; --grid: #e2e8e4; --edge: #7c8c84; --accent: #0b6a5b; --accent-soft: #d3e9e3; --mark: #b0561a;
  --mark-soft: #f4dfcd; --cs: #5b4fb3; --py: #8f6410; --warn: #a3341f; --warn-soft: #f3d9d2; --chan: #1f62ad;
  --cross: #a2387f; --ok: #2f7a3d; --ok-soft: #d8ecd9;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --surface: #161e1b; --sunken: #0b100e; --ink: #e2e9e5; --muted: #8d9d95;
  --line: #2a3631; --grid: #141c19; --edge: #6e7f77; --accent: #55c4ab; --accent-soft: #173a33; --mark: #e8a15c;
  --mark-soft: #40291a; --cs: #a99df2; --py: #ddb155; --warn: #f08a75; --warn-soft: #43201a; --chan: #7db5f2;
  --cross: #e48cc8; --ok: #7fcf8c; --ok-soft: #1b3520;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --sunken: #0b100e; --ink: #e2e9e5; --muted: #8d9d95;
  --line: #2a3631; --grid: #141c19; --edge: #6e7f77; --accent: #55c4ab; --accent-soft: #173a33; --mark: #e8a15c;
  --mark-soft: #40291a; --cs: #a99df2; --py: #ddb155; --warn: #f08a75; --warn-soft: #43201a; --chan: #7db5f2;
  --cross: #e48cc8; --ok: #7fcf8c; --ok-soft: #1b3520;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
#app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
#app *, #app *::before { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px;
  padding-inline: 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { font-weight: 600; letter-spacing: 0.02em; display: flex; align-items: baseline; gap: 8px; }
.brand small { font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; min-width: 0; flex: 1 1 240px; }
.crumbs button { background: none; border: 0; padding: 3px 6px; border-radius: 4px; font: 13px var(--mono);
  color: var(--muted); max-width: 100%; overflow-wrap: anywhere; text-align: left; }
.crumbs button:hover { background: var(--sunken); color: var(--ink); }
.crumbs button[aria-current] { color: var(--ink); font-weight: 500; }
.crumbs .sep { color: var(--line); }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tabs button { background: none; border: 0; padding: 5px 12px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.tabs .count { font: 11px var(--mono); color: var(--muted); margin-left: 4px; }
.morewrap { position: relative; display: flex; }
.menu { position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; min-width: 210px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgb(0 0 0 / 0.18); padding: 4px 0; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 12px; }
.menu button small { display: block; color: var(--muted); font-size: 12px; }
.menu button:hover, .menu button:focus-visible { background: var(--accent-soft); }
.menu button[aria-pressed="true"] { box-shadow: inset 3px 0 0 var(--accent); }
.search { position: relative; flex: 0 1 240px; min-width: 150px; }
.search input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); }
.results { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; min-width: 260px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; max-height: 320px;
  overflow: auto; box-shadow: 0 6px 18px rgb(0 0 0 / 0.18); }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0;
  padding: 6px 10px; border-bottom: 1px solid var(--line); }
.results button:last-child { border-bottom: 0; }
.results button:hover, .results button:focus-visible { background: var(--accent-soft); }
.results b { font: 500 13px var(--mono); display: block; overflow-wrap: anywhere; }
.results span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background:
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 48px,
  linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 48px 100%, var(--bg); }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#map.dragging { cursor: grabbing; }
.tools { position: absolute; z-index: 3; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px;
  max-width: calc(100% - 24px); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px;
  font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--edge); }
.chip[aria-pressed="true"]::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.chip.zoom { border-radius: 6px; padding: 3px 9px; color: var(--ink); }
.hint { position: absolute; left: 12px; bottom: 10px; right: 12px; font-size: 12px; color: var(--muted);
  display: flex; flex-wrap: wrap; gap: 4px 16px; pointer-events: none; }
.hint i { font-style: normal; display: inline-flex; align-items: center; gap: 6px; }
.hint svg { width: 30px; height: 8px; }

.node rect { fill: var(--surface); stroke: var(--edge); stroke-width: 1.2; }
.node text { fill: var(--ink); font: 500 12.5px var(--mono); pointer-events: none; }
.node text.meta { fill: var(--muted); font: 11px var(--sans); }
.node { cursor: pointer; }
.node.stub rect { fill: var(--bg); stroke-dasharray: 2 3; }
.node.stub text { fill: var(--muted); }
.node.iso rect { stroke: var(--line); }
.node:hover rect { stroke: var(--accent); }
.node.sel rect { stroke: var(--mark); stroke-width: 2.2; fill: var(--mark-soft); }
.node.near rect { stroke: var(--accent); stroke-width: 1.8; }
.node .lang-csharp { fill: var(--cs); } .node .lang-python { fill: var(--py); } .node .lang-none { fill: var(--edge); }
.node .flag { fill: var(--mark); }
.dim { opacity: 0.18; }
.dense .edge:not(.near):not(.sel) path.vis { opacity: 0.45; }
.edge path.vis { fill: none; stroke: var(--edge); }
.edge.heur path.vis { stroke-dasharray: 5 4; }
.edge.guess path.vis { stroke-dasharray: 1.5 4; stroke-linecap: round; }
.edge.comm path.vis { stroke: var(--chan); stroke-dasharray: 9 3 2 3; }
.edge.comm text { fill: var(--chan); }
#arrow-c path { fill: var(--chan); }
.edge path.hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.edge text { font: 11px var(--mono); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; pointer-events: none; }
.edge:hover path.vis, .edge.near path.vis { stroke: var(--accent); }
.edge.near text { fill: var(--ink); }
.edge.sel path.vis { stroke: var(--mark); }
.edge.sel text { fill: var(--mark); font-weight: 500; }
#arrow path { fill: var(--edge); } #arrow-a path { fill: var(--accent); } #arrow-m path { fill: var(--mark); } #arrow-x path { fill: var(--cross); }
.edge.cross path.vis { stroke: var(--cross); }
.edge.cross text { fill: var(--cross); }
.node.other rect:first-child { stroke: var(--cross); stroke-dasharray: 2 3; }
.group-label { font: 11px var(--sans); fill: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

.matrix-wrap { height: 100%; overflow: auto; padding: 56px 16px 40px; }
table.matrix { border-collapse: collapse; font: 11.5px var(--mono); font-variant-numeric: tabular-nums; }
.matrix th { font-weight: 400; color: var(--muted); white-space: nowrap; }
.matrix th.row { text-align: right; padding: 0 8px 0 0; position: sticky; left: 0; background: var(--bg); z-index: 1;
  max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.matrix th.col { height: 160px; vertical-align: bottom; padding: 0; }
.matrix th.col div { writing-mode: vertical-rl; transform: rotate(180deg); padding: 6px 0; max-height: 158px;
  overflow: hidden; text-overflow: ellipsis; margin: 0 auto; }
.matrix td { width: 26px; min-width: 26px; height: 24px; text-align: center; border: 1px solid var(--line);
  background: var(--surface); padding: 0; }
.matrix td.diag { background: var(--sunken); }
.matrix td.on { cursor: pointer; color: var(--ink); }
.matrix td.back { background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.matrix td.sel { outline: 2px solid var(--mark); outline-offset: -2px; }
.matrix tr:hover th.row { color: var(--ink); }
.matrix-note { font-size: 12px; color: var(--muted); max-width: 62ch; margin: 0 0 14px; }

.side { border-left: 1px solid var(--line); background: var(--surface); overflow: auto; min-width: 0; padding: 16px; }
.side h2 { font: 600 16px/1.25 var(--mono); margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
.side h3 { font: 600 11px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  margin: 18px 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.side h3 span { font-weight: 400; letter-spacing: 0; text-transform: none; }
.eyebrow { font: 11px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px;
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font: 11px var(--sans); letter-spacing: 0; text-transform: none; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.tag.entry { border-color: var(--mark); color: var(--mark); }
.tag.heur { border-style: dashed; }
.sig { font: 12.5px/1.5 var(--mono); background: var(--sunken); padding: 8px 10px; border-radius: 6px; margin-top: 10px;
  overflow-wrap: anywhere; }
.where { font: 12px var(--mono); color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 8px; margin-top: 12px; }
.facts div { border-top: 2px solid var(--line); padding-top: 4px; }
.facts b { font: 500 17px var(--mono); display: block; font-variant-numeric: tabular-nums; }
.facts span { font-size: 11.5px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { border-top: 1px solid var(--line); }
.list button { display: flex; width: 100%; gap: 8px; justify-content: space-between; align-items: baseline;
  background: none; border: 0; padding: 5px 2px; text-align: left; }
.list button:hover { background: var(--accent-soft); }
.list .nm { font: 12.5px var(--mono); overflow-wrap: anywhere; min-width: 0; }
.list .nm small { display: block; font: 11.5px var(--sans); color: var(--muted); }
.list .ct { font: 12px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.list .plain { padding: 5px 2px; display: flex; justify-content: space-between; gap: 8px; }
.more { font-size: 12px; color: var(--muted); padding: 5px 2px; border-top: 1px solid var(--line); }
.open { margin-top: 12px; background: var(--accent); color: var(--surface); border: 0; border-radius: 6px; padding: 7px 14px; font-weight: 500; }
.open:hover { filter: brightness(1.1); }
.note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; max-width: 60ch; }
pre.code { font: 12px/1.5 var(--mono); background: var(--sunken); border-radius: 6px; padding: 8px 0; margin: 0;
  overflow: auto; max-height: 420px; tab-size: 4; }
pre.code code { display: block; padding: 0 10px 0 0; white-space: pre; }
pre.code .ln { display: inline-block; width: 3.6em; padding-right: 0.9em; text-align: right; color: var(--muted);
  user-select: none; opacity: 0.7; }
.status { font: 12px var(--mono); }
.status.ok { color: var(--accent); } .status.na { color: var(--muted); }
.tag.chan { border-color: var(--chan); color: var(--chan); }
.tag.risk-high { border-color: var(--warn); color: var(--warn); } .tag.risk-medium { border-color: var(--mark); color: var(--mark); }
.node.role-changed rect:first-child { fill: var(--mark-soft); stroke: var(--mark); stroke-width: 2.4; }
.node.role-new rect:first-child { fill: var(--mark-soft); stroke: var(--mark); stroke-width: 2; stroke-dasharray: 5 3; }
.node.role-contract rect:first-child { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 2; stroke-dasharray: 6 3; }
.node.role-must_edit rect:first-child { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.8; }
.node.role-direct rect:first-child { stroke: var(--accent); stroke-width: 1.8; fill: var(--accent-soft); }
.node.role-test rect:first-child { stroke: var(--chan); stroke-width: 1.6; }
.node.role-indirect rect:first-child { stroke: var(--line); }
.node.role-c0 rect:first-child { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
.node.role-c1 rect:first-child { stroke: var(--mark); stroke-width: 2; fill: var(--mark-soft); }
.node.role-c2 rect:first-child { stroke: var(--chan); stroke-width: 2; }
.node.role-c3 rect:first-child { stroke: var(--warn); stroke-width: 2; fill: var(--warn-soft); }
.node.role-c4 rect:first-child { stroke: var(--cs); stroke-width: 2; }
.node.role-c5 rect:first-child { stroke: var(--py); stroke-width: 2; }
.node.role-done rect:first-child { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 2.4; }
.node.role-done_new rect:first-child { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 2.2; stroke-dasharray: 5 3; }
.node.role-helper rect:first-child { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.4; stroke-dasharray: 2 3; }
.node.role-test_changed rect:first-child { stroke: var(--chan); stroke-width: 2; }
.node.role-drift rect:first-child { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 2.4; }
.node.role-missed rect:first-child { fill: var(--mark-soft); stroke: var(--mark); stroke-width: 2; stroke-dasharray: 6 3; }
.node.picked rect:first-child { stroke-width: 3.4; }
.node .pin { fill: var(--ink); font: 600 11px var(--sans); }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key b { width: 14px; height: 10px; border-radius: 2px; border: 2px solid var(--line); display: inline-block; }
.key .k-changed, .key .k-c1, .key .k-new { background: var(--mark-soft); border-color: var(--mark); }
.key .k-must_edit, .key .k-contract, .key .k-c3 { background: var(--warn-soft); border-color: var(--warn); }
.key .k-direct, .key .k-c0 { background: var(--accent-soft); border-color: var(--accent); }
.key .k-test, .key .k-c2, .key .k-test_changed { border-color: var(--chan); } .key .k-c4 { border-color: var(--cs); } .key .k-c5 { border-color: var(--py); }
.key .k-done, .key .k-done_new, .key .k-helper { background: var(--ok-soft); border-color: var(--ok); }
.key .k-drift { background: var(--warn-soft); border-color: var(--warn); } .key .k-missed { background: var(--mark-soft); border-color: var(--mark); border-style: dashed; }
.key .k-direct, .key .k-indirect { border-color: var(--accent); } .key .k-indirect { border-color: var(--line); }
.tools select { font: 13px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--edge);
  border-radius: 6px; padding: 4px 8px; max-width: min(100%, 460px); }
.flow-wrap { height: 100%; overflow: auto; padding: 14px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
.flow-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.flow-head select { font: 13px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; max-width: 100%; min-width: 0; flex: 1 1 280px; }
.flow-head span { font-size: 12px; color: var(--muted); }
.steps button.idle { opacity: .55; }
.tour { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 12px 14px 12px; margin-bottom: 18px; }
.tour h2 { margin-top: 4px; }
.tour .note { color: var(--ink); }
.tour-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12.5px; }
.tour-top select { font: 12.5px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-width: 0; max-width: 100%; }
.tour-nav { display: flex; gap: 8px; margin-top: 10px; }
.tour button { font: 12.5px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
.tour button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); margin-left: auto; }
.tour button:disabled { opacity: .45; cursor: default; }
.flow-head input { font: 13px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; min-width: 190px; }
.flow-head select { max-width: min(100%, 560px); }
.steps { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  overflow-x: auto; }
.steps li { border-top: 1px solid var(--line); min-width: max-content; }
.steps li:first-child { border-top: 0; }
.steps button { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; text-align: left;
  padding: 4px 10px; font: 12.5px var(--mono); white-space: nowrap; }
.steps button:hover { background: var(--accent-soft); }
.steps button[aria-current="true"] { background: var(--mark-soft); box-shadow: inset 3px 0 0 var(--mark); }
.steps .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.steps .seq { color: var(--muted); font-size: 11px; width: 2.4em; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.steps .ind { flex: none; width: calc(var(--d) * 18px); }
.steps .mod { color: var(--muted); font: 11.5px var(--sans); margin-left: auto; padding-left: 24px; }
.steps .via { font: 11px var(--sans); color: var(--chan); border: 1px solid var(--chan); border-radius: 4px; padding: 0 5px; }

.state { border-radius: 6px; padding: 8px 10px; margin: 12px 0 0; border: 1px solid var(--line); background: var(--sunken); }
.state.ok { border-color: var(--ok); background: var(--ok-soft); } .state.todo { border-color: var(--mark); background: var(--mark-soft); }
.state.ready { border-color: var(--accent); background: var(--accent-soft); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 4px 11px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.onmap { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.keylist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.keylist li { display: flex; align-items: center; gap: 8px; }
.keylist .key b { flex: none; }
.keylist .n { font: 12px var(--mono); color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.md { font-size: 13.5px; }
.md h3 { margin-top: 22px; }
.md p { margin: 8px 0 0; max-width: 64ch; }
.md ul { margin: 6px 0 0; padding-left: 18px; }
.md li { margin: 2px 0; }
.md code { font: 12px var(--mono); background: var(--sunken); border-radius: 3px; padding: 0 3px; overflow-wrap: anywhere; }
.md .tbl { overflow-x: auto; margin-top: 8px; }
.md table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.md th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; border-bottom: 1px solid var(--line); padding: 4px 6px 4px 0; }
.md td { border-top: 1px solid var(--line); padding: 5px 6px 5px 0; vertical-align: top; overflow-wrap: anywhere; }
.md tr[data-task], .md tr[data-scenario] { cursor: pointer; }
.md tr[data-task]:hover td, .md tr[data-scenario]:hover td { background: var(--accent-soft); }
.md tr[aria-current="true"] td { background: var(--mark-soft); }
.md td.res-done, .md td.res-passes { color: var(--ok); font-weight: 500; }
.md td.res-not-done, .md td.res-fails, .md td.res-partly, .md td.res-no-test { color: var(--warn); font-weight: 500; }
.changes { list-style: none; margin: 8px 0 0; padding: 0; }

  for (const t of c.tasks) for (const nw of t.new) if (nw.pi != null) marks.push({ i: nw.pi, role: "new", note: "new: " + nw.name });
  // A test that runs through the change is shown as a test, as leyline.md counts it, not only as code it reaches.
  const tests = new Set((v.tests_to_run || []).map((t) => t.i).filter((i) => i != null));
  return { ...v, kind: "change", marks: marks.map((m) => (tests.has(m.i) && (m.role === "direct" || m.role === "indirect") ? { ...m, role: "test" } : m)) };
}
function curView() { return S.mode === "change" && S.change != null ? changeView(CHANGES[S.change], S.phase) : VIEWS[S.viewIdx]; }
function openChange(k) {
  S.change = k; S.phase = CHANGES[k].after ? "after" : "plan"; S.pick = null;
  try { history.replaceState(null, "", "#change=" + encodeURIComponent(CHANGES[k].name)); } catch (e) { /* a sandboxed page */ }
  setMode("change"); crumbs();
}
function setPhase(ph) { S.phase = ph; S.sel = null; viewSetup(); draw(); tools(); side(); requestAnimationFrame(fit); }
// Every box that holds a marked node, with the strongest role inside it: the change drawn over the ordinary map.
let overKey = null, overMap = null;
function overlay() {
  const key = S.change + ":" + S.phase;
  if (key === overKey) return overMap;
  const rank = (r) => { const k = ROLE_ORDER.indexOf(r); return k < 0 ? 99 : k; }, m = new Map();
  const put = (c, r) => { if (!m.has(c) || rank(r) < rank(m.get(c))) m.set(c, r); };
  for (const mk of changeView(CHANGES[S.change], S.phase).marks) for (let c = mk.i; c != null; c = N[c].p) { put(c, mk.role); if (sysOf.has(c)) put(sysOf.get(c), mk.role); }
  overKey = key; overMap = m;
  return m;
}
const normName = (x) => String(x).toLowerCase().replace(/test_/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const scenarioTest = (c, name) => { const sc = c.scenarios.find((x) => x.name === name); if (sc && sc.test != null) return sc.test; const k = N.findIndex((n) => (n.k === "test" || (n.k === "callable" && /^test/i.test(n.n))) && normName(n.n) === normName(name)); return k >= 0 ? k : null; };
function pickNodes(c, p) {
  if (!p) return [];
  if (p.task) { const t = c.tasks.find((x) => x.key === p.task); return t ? [...t.nodes, ...t.into, ...t.new.map((x) => x.pi).filter((x) => x != null)] : []; }
  const t = scenarioTest(c, p.scenario); return t != null ? [t] : [];
}
function picked() {
  if (S.change == null || !S.pick) return null;
  const set = new Set();
  for (const i of pickNodes(CHANGES[S.change], S.pick)) for (let c = i; c != null; c = N[c].p) { set.add(c); if (sysOf.has(c)) set.add(sysOf.get(c)); }
  return set;
}
// leyline.md as blocks. It is generated, so a small reader covers it: headings, paragraphs, lists, tables.
function mdBlocks(text) {
  const lines = text.replace(/<!--[\s\S]*?-->/g, "").split("\n"), out = [];
  let k = 0, section = "";
  while (k < lines.length) {
    const ln = lines[k];
    if (!ln.trim()) { k++; continue; }
    if (ln.startsWith("# ")) { out.push({ t: "title", text: ln.slice(2) }); k++; continue; }
    if (ln.startsWith("## ")) { section = ln.slice(3); out.push({ t: "h", text: section }); k++; continue; }
    if (ln.startsWith("|")) { const rows = []; while (k < lines.length && lines[k].startsWith("|")) rows.push(lines[k++]); out.push({ t: "table", rows: rows.map((r) => r.split("|").slice(1, -1).map((c) => c.trim())), section }); continue; }
    if (/^\s*- /.test(ln)) { const items = []; while (k < lines.length && /^\s*- /.test(lines[k])) items.push(lines[k++].replace(/^\s*- /, "")); out.push({ t: "ul", items }); continue; }
    const para = []; while (k < lines.length && lines[k].trim() && !/^(#|\||\s*- )/.test(lines[k])) para.push(lines[k++]);
    out.push({ t: "p", text: para.join(" ") });
  }
  return out;
}
const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
function tableHtml(b) {
  const [head, , ...body] = b.rows;
  const isTask = head[0] === "Task", isScen = head[0] === "Scenario", result = head[1] === "Result";
  const cur = S.pick || {};
  return `<div class="tbl"><table><thead><tr>${head.map((h) => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map((r) => {
    const key = isTask ? r[0].split(" ")[0] : isScen ? r[0] : null;
    const on = key != null && (isTask ? cur.task === key : cur.scenario === key);
    const attr = isTask ? ` data-task="${esc(key)}"` : isScen ? ` data-scenario="${esc(key)}"` : "";
    return `<tr${attr}${on ? ` aria-current="true"` : ""}${attr ? ' tabindex="0"' : ""}>${r.map((c, j) => `<td${result && j === 1 ? ` class="res-${esc(c.split(" (")[0].replace(/\s+/g, "-"))}"` : ""}>${inline(c)}</td>`).join("")}</tr>`;
  }).join("")}</tbody></table></div>`;
}
function keyHtml(c) {
  const have = new Set(changeView(c, S.phase).marks.map((m) => m.role));
  return `<ul class="keylist">${ROLE_ORDER.filter((r) => have.has(r)).map((r) => `<li><span class="key"><b class="k-${r}"></b></span>${esc(ROLE_LABEL[r])}</li>`).join("")}</ul>`;
}
function pickHtml(c) {
  if (!S.pick) return `<p class="note">Select a task or a scenario below to outline its code on the map. Double-click a box to open it on the full map.</p>`;
  const ns = pickNodes(c, S.pick), shown = picked(), onMap = [...L.boxes.keys()].some((i) => shown && shown.has(i));
  const what = S.pick.task ? "Task " + S.pick.task : "Scenario " + S.pick.scenario;
  const fi = S.pick.scenario && ns.length ? FLOWS.findIndex((f) => f.entry === ns[0]) : -1;
  const t = S.pick.task ? c.tasks.find((x) => x.key === S.pick.task) : null;
  const newOnly = t && !t.nodes.length && !t.into.length;
  const why = !ns.length ? (S.pick.scenario ? "Its test is not on the map yet: it is to be written, with this name." : "It names no code on the map.") : !onMap ? (newOnly ? "Its code is new, so it is not on the map; its box shows where it goes once the plan is followed." : "Its code is not in this picture; open it on the full map.") : "";
  return `<p class="note"><b>${esc(what)}</b> is outlined on the map. ${why} ${ns.length ? `<button class="chip" data-go="${ns[0]}">Show on the full map</button>` : ""} ${fi >= 0 ? `<button class="chip" data-flow="${fi}">Trace what the test runs</button>` : ""} <button class="chip" id="unpick">Clear</button></p>`;
}
function stateClass(text) { return /done as agreed\./.test(text) ? "ok" : /ready to implement\./.test(text) ? "ready" : "todo"; }
function changeHtml() {
  if (!CHANGES.length) return `<div class="eyebrow">Changes</div><h2>No change is planned yet</h2>
    <p class="note">A change is planned as an OpenSpec folder, <code>openspec/changes/&lt;id&gt;/</code>, whose tasks say what code will be written and whose scenarios say how you will know it works. Ask your agent to write one (the leyline-spec skill says how), then run <code>leyline plan &lt;id&gt;</code>.</p>
    <p class="note">The map page is then rewritten with the change on it: what will be written, what else must be edited with it, and which tests run through it. After <code>leyline check</code> it also shows what was done.</p>`;
  if (S.change == null) return `<div class="eyebrow">Changes</div><h2>${CHANGES.length} planned changes</h2>
    <p class="note">Pick one to see on the map what it will write and, once it has been checked, what was done.</p>
    <ul class="changes">${CHANGES.map((c, k) => { const st = c.page && (c.page.match(/\*\*State:([^*]+)\*\*/) || [])[1]; return `<li><button data-change="${k}"><b>${esc(c.title)}</b><small>${st ? "State:" + esc(st) : c.after ? "checked" : "planned"}</small><small>${esc(c.folder || c.id)}</small></button></li>`; }).join("")}</ul>`;
  const c = CHANGES[S.change];
  let h = CHANGES.length > 1 ? `<div class="banner"><span>Change ${S.change + 1} of ${CHANGES.length}</span><button id="all-changes">All changes</button></div>` : "";
  h += `<div class="eyebrow">Change <span class="tag">${esc(c.folder || c.id)}</span></div><h2>${esc(c.title)}</h2>`;
  const onmap = `<section class="onmap" aria-label="On the map"><div class="eyebrow">On the map: ${S.phase === "after" ? "what was done, from the last check" : "what the plan will change"}</div>${keyHtml(c)}${pickHtml(c)}</section>`;
  if (!c.page) {
    const v = viewById(c.plan_view) || {};
    return h + `<p class="note">${esc(v.narrative || "")}</p><p class="note">This change was assessed without a spec folder, so it has no leyline.md page.</p>` + onmap + `<div class="md">${listHtml("Tests to run", (v.tests_to_run || []).slice(0, 30).map((t) => ({ go: t.i, name: t.name, ct: "" })), (v.tests_to_run || []).length)}</div>`;
  }
  let body = "", placed = false;
  for (const b of mdBlocks(c.page)) {
    if (b.t === "title") continue;
    if (b.t === "p" && b.text.startsWith("**State:")) { h += `<p class="state ${stateClass(b.text)}">${inline(b.text)}</p>`; continue; }
    if (b.t === "p" && /^The one-page plan for/.test(b.text)) continue;
    if (b.t === "h" && !placed) { body += onmap; placed = true; }
    body += b.t === "h" ? `<h3>${inline(b.text)}</h3>` : b.t === "p" ? `<p>${inline(b.text)}</p>` : b.t === "ul" ? `<ul>${b.items.map((x) => `<li>${inline(x)}</li>`).join("")}</ul>` : tableHtml(b);
  }
  if (!placed) body += onmap;
  return h + `<div class="md">${body}<p class="note">This is <code>${esc(c.folder)}leyline.md</code>, written by <code>leyline plan</code> and <code>leyline check</code>. To change the plan, edit the spec files beside it and run <code>leyline plan ${esc(c.name)}</code> again.</p></div>`;
}
const backHtml = () => `<div class="banner"><span>${esc(CHANGES[S.change].title)}</span><button id="to-change">Back to the change</button></div>`;
const shownHtml = () => `<div class="banner"><span>The map shows the change <b>${esc(CHANGES[S.change].title)}</b>: ${S.phase === "after" ? "what was done" : "what the plan will change"}.</span><button id="to-change">Back to the change</button><button id="hide-change">Hide</button></div>`;
function wireChange(s) {
  for (const b of s.querySelectorAll("[data-change]")) b.onclick = () => openChange(+b.dataset.change);
  if ($("all-changes")) $("all-changes").onclick = () => { S.change = null; S.pick = null; setMode("change"); };
  if ($("to-change")) $("to-change").onclick = () => { S.sel = null; if (S.mode === "change") { mark(); side(); } else setMode("change"); };
  if ($("hide-change")) $("hide-change").onclick = () => { S.change = null; S.pick = null; draw(); side(); };
  if ($("unpick")) $("unpick").onclick = () => { S.pick = null; mark(); side(); };
  const choose = (p) => { const same = S.pick && S.pick.task === p.task && S.pick.scenario === p.scenario; S.pick = same ? null : p; mark(); const top = s.scrollTop; side(); s.scrollTop = top; };
  for (const r of s.querySelectorAll("[data-task]")) { r.onclick = () => choose({ task: r.dataset.task }); r.onkeydown = (e) => { if (e.key === "Enter") r.click(); }; }
  for (const r of s.querySelectorAll("[data-scenario]")) { r.onclick = () => choose({ scenario: r.dataset.scenario }); r.onkeydown = (e) => { if (e.key === "Enter") r.click(); }; }
}
/* ---------- workspace ---------- */
function wsHtml() {
  const pairs = new Map(), called = new Map();
  for (const Lk of LINKS) {
    const a = repoOf[Lk[1]], b = repoOf[Lk[2]];
    if (a == null || b == null || a === b) continue;
    const key = a + ">" + b; let p = pairs.get(key); if (!p) pairs.set(key, p = { a, b, n: 0, kinds: {} });
    p.n += Lk[4]; p.kinds[linkLabel(Lk)] = (p.kinds[linkLabel(Lk)] || 0) + Lk[4];
    if (Lk[0] === "calls") { const c = called.get(Lk[2]) || new Set(); c.add(Lk[1]); called.set(Lk[2], c); }
  }
  const crossing = FLOWS.filter((f) => f.steps.some((st) => repoOf[st[0]] !== repoOf[f.entry])).length;
  const facts = [[REPOS.length, "repositories"], [N.filter((n) => n.k === "module").length, "modules"], [N.filter((n) => n.k === "file").length, "files"], [big(REPOS.reduce((t, r) => t + linesOf(r), 0)), "lines"]];
  const prs = [...pairs.values()].sort((x, y) => y.n - x.n);
  const top = [...called.entries()].sort((x, y) => y[1].size - x[1].size).slice(0, 12);
  return `<div class="eyebrow">Workspace</div><h2>${REPOS.map((r) => esc(N[r].n)).join(" + ")}</h2>
    <div class="facts">${facts.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>
    <p class="note">One store holds ${REPOS.length} repositories, indexed together so that a call from one into another links to the code it reaches. Each box is a repository; an arrow from A to B means code in A uses code in B, and its number counts the links. Double-click a repository to see its modules; links into the others stay on that map, dashed and in their own colour.</p>
    ${CHANGES.length && S.change == null ? `<p class="note">${CHANGES.length === 1 ? "One change is" : CHANGES.length + " changes are"} planned. Open <b>Changes</b> to see on the map what ${CHANGES.length === 1 ? "it" : "each"} will write.</p>` : ""}
    ${listHtml("Repositories", REPOS.map((r) => ({ go: r, name: N[r].n, sub: repoMeta(r).url || "", ct: big(linesOf(r)) + " lines" })), REPOS.length)}
    <h3>Links between repositories <span>${prs.length}</span></h3>${prs.length ? `<ul class="list">${prs.map((p) => `<li><button data-edge="${p.a}>${p.b}"><span class="nm">${esc(N[p.a].n)} → ${esc(N[p.b].n)}<small>${esc(Object.entries(p.kinds).sort((x, y) => y[1] - x[1]).map(([k, v]) => `${k} ${v.toLocaleString()}`).join(" · "))}</small></span><span class="ct">${p.n.toLocaleString()}</span></button></li>`).join("")}</ul>` : `<p class="note">None found: no code in one repository uses code in another.</p>`}
    ${listHtml("Most used from another repository", top.map(([d, cs]) => ({ go: d, name: qual(d), sub: "in " + N[repoOf[d]].n + " · called from " + [...new Set([...cs].map((c) => N[repoOf[c]].n))].join(", "), ct: cs.size + " callers" })), called.size)}
    <h3>Flows that cross</h3><p class="note">${crossing.toLocaleString()} of ${FLOWS.length.toLocaleString()} flows (what a test or an entry point runs through) pass into another repository. Find them under More, Flows.</p>`;
}

/* ---------- search ---------- */
const searchable = N.filter((n) => ["system", "module", "file", "type", "callable", "field", "test"].includes(n.k) && n.n !== "<module>" && n.n !== "<top-level>");
const rank = { system: 0, module: 0, type: 1, file: 2, callable: 3, field: 4, test: 5 };
$("q").addEventListener("input", () => {
  const q = $("q").value.trim().toLowerCase(), box = $("results");
  if (q.length < 2) { box.hidden = true; return; }
  const words = q.split(/[\s.]+/).filter(Boolean);
  const hits = [];
  for (const n of searchable) {
    const hay = (n.i.split(":").slice(2).join(":") + " " + (n.f || "")).toLowerCase(), name = n.n.toLowerCase();
    if (!words.every((w) => hay.includes(w))) continue;
    const last = words[words.length - 1];
    hits.push([(name === q ? -2 : name.includes(q) && words.length > 1 ? -1 : name === last ? 0 : name.startsWith(last) ? 1 : name.includes(last) ? 2 : 3) * 10 + rank[n.k], n.i.length, n]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  box.innerHTML = hits.slice(0, 14).map(([, , n]) => `<button data-go="${n.idx}"><b>${esc(n.k === "callable" || n.k === "field" ? qual(n.idx) : n.n)}</b><span>${esc(kindName(n.idx))}${WS && repoOf[n.idx] != null ? " · " + esc(N[repoOf[n.idx]].n) : ""} · ${esc(where(n.idx))}</span></button>`).join("") || `<button disabled><span>Nothing matches “${esc(q)}”.</span></button>`;
  box.hidden = false;
  for (const b of box.querySelectorAll("[data-go]")) b.onclick = () => { box.hidden = true; $("q").value = ""; if (S.mode === "matrix" || S.mode === "views" || S.mode === "change") setMode("map"); goTo(+b.dataset.go); };
});
$("q").addEventListener("keydown", (e) => { if (e.key === "Escape") { $("results").hidden = true; $("q").blur(); } if (e.key === "Enter") { const b = $("results").querySelector("[data-go]"); if (b) b.click(); } });
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) $("results").hidden = true; });

/* ---------- start ---------- */
$("hint-cross").hidden = !WS;
$("change-count").textContent = CHANGES.length ? " " + CHANGES.length : "";
const asked = decodeURIComponent((location.hash.match(/change=([^&]+)/) || [])[1] || "") || (D.start && D.start.change);
const startAt = asked ? CHANGES.findIndex((c) => c.name === asked || c.id === asked) : -1;
if (startAt >= 0) openChange(startAt); else render(true);
window.addEventListener("resize", () => { if (S.mode === "map") fit(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { draw(); fit(); });
})();
</script>
