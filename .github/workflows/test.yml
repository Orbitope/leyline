# Run the tests on every push and pull request, on the three systems people run Leyline on, at the oldest and the
# newest Python it supports. Tests that need the .NET SDK or a browser skip themselves where those are missing.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # The fixtures are compared line by line; a Windows checkout would otherwise turn their line endings to CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[scip]" pytest
      # More grammars widen what the generic-adapter tests cover. Not every grammar has a wheel for every system
      # and Python, so a failure here only narrows the run.
      - run: python -m pip install -e ".[languages]"
        continue-on-error: true
      - name: Run the tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=line -p no:cacheprovider 2>&1 | tee pytest-output.txt
      # The failures as annotations, so they can be read without the full log.
      - name: Name the failures
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " pytest-output.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "^(E  |[^ ].*:[0-9]+: )" pytest-output.txt | head -40 | while IFS= read -r line; do echo "::warning::$line"; done
          tail -n 25 pytest-output.txt | while IFS= read -r line; do echo "::notice::$line"; done
