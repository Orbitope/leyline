# Run the tests on every push and pull request, on the three systems people run Leyline on, at the oldest and the
# newest Python it supports. Tests that need the .NET SDK or a browser skip themselves where those are missing.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # The fixtures are compared line by line; a Windows checkout would otherwise turn their line endings to CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[scip]" pytest
      # More grammars widen what the generic-adapter tests cover. Not every grammar has a wheel for every system
      # and Python, so a failure here only narrows the run.
      - run: python -m pip install -e ".[languages]"
        continue-on-error: true
      # Python runs the tests and keeps their output, so the same steps work on every system's shell.
      - name: Run the tests
        shell: python
        run: |
          import subprocess, sys
          with open("pytest-output.txt", "w", encoding="utf-8") as out:
              proc = subprocess.Popen([sys.executable, "-X", "faulthandler", "-m", "pytest", "-v", "-rfE", "--tb=line",
                                       "-p", "no:cacheprovider"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      text=True, encoding="utf-8", errors="replace")
              for line in proc.stdout:
                  sys.stdout.write(line)
                  out.write(line)
                  out.flush()
          sys.exit(proc.wait())
      # The failures as annotations, so they can be read without the full log.
      - name: Name the failures
        if: failure()
        continue-on-error: true
        shell: python
        run: |
          lines = open("pytest-output.txt", encoding="utf-8", errors="replace").read().splitlines()
          for line in [l for l in lines if l.startswith(("FAILED ", "ERROR "))][:40]:
              print("::error::" + line)
          for line in lines[-25:]:
              print("::notice::" + line)
